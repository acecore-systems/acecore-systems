name: Submit Workers AI Translation Batch

on:
  push:
    branches:
      - main
    paths:
      - src/data/**/*.json
      - src/content/insights/*.md
      - src/i18n/contact-form.ts
      - src/i18n/ui.ts
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for consecutive source edits
        run: sleep 900

      - name: Use current main as the source version
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Submit Workers AI Batch
        id: submit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_WORKERS_AI_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_WORKERS_AI_API_TOKEN are not configured; no Batch was submitted."
            exit 0
          fi
          node --experimental-strip-types scripts/openai-translation-batch.mjs submit --head=HEAD

      - name: Remember pending Workers AI batch
        if: steps.submit.outputs.batch_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: workers-ai-translation-pending-${{ steps.submit.outputs.batch_id }}
          path: ${{ steps.submit.outputs.pending_marker_path }}
          retention-days: 30
