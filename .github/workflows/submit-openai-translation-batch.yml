name: Submit OpenAI Translation Batch

on:
  push:
    branches:
      - main
    paths:
      - src/data/**/*.json
      - src/content/insights/*.md
      - src/i18n/contact-form.ts
      - src/i18n/ui.ts
  workflow_dispatch:
    inputs:
      retry_batch_id:
        description: "既存の完了Batchで検証に失敗した最大10件だけを再翻訳する（通常投入は空欄）"
        required: false
        default: ""
        type: string
      retry_dry_run:
        description: "再試行対象の件数確認だけ行い、新しいBatchは作らない"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  submit:
    runs-on: ubuntu-latest
    concurrency:
      group: openai-translation-batch-submit
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for consecutive source edits
        if: github.event_name != 'workflow_dispatch' || inputs.retry_batch_id == ''
        run: sleep 900

      - name: Use current main as the source version
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Submit OpenAI Batch
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          RETRY_BATCH_ID: ${{ inputs.retry_batch_id }}
          RETRY_DRY_RUN: ${{ inputs.retry_dry_run }}
        run: |
          if [ -z "$OPENAI_TRANSLATION_API_KEY" ]; then
            echo "::warning::OPENAI_TRANSLATION_API_KEY is not configured; no Batch was submitted."
            exit 0
          fi
          if [ -n "$RETRY_BATCH_ID" ]; then
            retry_args=(--batch-id="$RETRY_BATCH_ID")
            if [ "$RETRY_DRY_RUN" = "true" ]; then
              retry_args+=(--dry-run)
            fi
            node --experimental-strip-types scripts/openai-translation-batch.mjs retry "${retry_args[@]}"
          else
            node --experimental-strip-types scripts/openai-translation-batch.mjs submit --head=HEAD
          fi
