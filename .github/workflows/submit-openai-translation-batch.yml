name: Inspect existing Systems translation Batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'acecore-systems/acecore-systems' && github.ref == 'refs/heads/codex/translation-batch-20261114-inspect' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Read Batch metadata and validate translation rows in memory
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
        run: node --experimental-strip-types scripts/inspect-translation-batch-20261114.mjs
