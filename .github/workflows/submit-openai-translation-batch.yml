name: Inspect SEO article Batch translation validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'acecore-systems/acecore-systems' && github.ref == 'refs/heads/codex/seo-article-batch-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: repair
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 022dafb3b8f1bdfec68a2cb501d6eee2697c8649
          path: source-main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: source-main/.node-version
      - name: Validate each of the eight Batch results
        working-directory: source-main
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
        run: node --experimental-strip-types ../repair/scripts/recover-seo-article-batch-20261114.mjs inspect
