name: Submit OpenAI Translation Batch

on:
  push:
    branches:
      - main
    paths:
      - src/data/**/*.json
      - src/content/insights/*.md
      - src/i18n/contact-form.ts
      - src/i18n/ui.ts
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for consecutive source edits
        run: sleep 900

      - name: Use current main as the source version
        run: |
          git fetch origin main
          git checkout --detach origin/main

      - name: Submit OpenAI Batch
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$OPENAI_TRANSLATION_API_KEY" ]; then
            echo "::warning::OPENAI_TRANSLATION_API_KEY is not configured; no Batch was submitted."
            exit 0
          fi
          node --experimental-strip-types scripts/openai-translation-batch.mjs submit --head=HEAD
