name: One-off SEO article translation submission

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  submit:
    if: github.repository == 'acecore-systems/acecore-systems' && github.ref == 'refs/heads/codex/seo-article-batch-20261114' && github.run_attempt == 1
    runs-on: ubuntu-latest
    concurrency:
      group: openai-translation-batch-submit
      cancel-in-progress: false
    steps:
      - name: Check out one-off branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out fixed source
        uses: actions/checkout@v7
        with:
          ref: 022dafb3b8f1bdfec68a2cb501d6eee2697c8649
          path: source-main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Offline scope validation
        run: |
          node --experimental-strip-types scripts/submit-seo-article-batch-20261114.mjs dry-run source-main
          node --experimental-strip-types scripts/submit-seo-article-batch-20261114.mjs self-test source-main
      - name: Verify prior intent and existing batches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          INTENT_PATH: ${{ runner.temp }}/seo-article-intent.json
        run: node --experimental-strip-types scripts/submit-seo-article-batch-20261114.mjs prepare source-main
      - name: Save submission intent
        id: intent
        uses: actions/upload-artifact@v7
        with:
          name: seo-article-eight-locale-batch-intent-20261114-v1
          path: ${{ runner.temp }}/seo-article-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Recheck and submit once
        if: steps.intent.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          INTENT_PATH: ${{ runner.temp }}/seo-article-intent.json
          INTENT_UPLOADED: ${{ steps.intent.outcome }}
        run: node --experimental-strip-types scripts/submit-seo-article-batch-20261114.mjs submit source-main
