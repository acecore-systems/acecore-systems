name: Check Insight Translation Review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Evaluate synthetic translations without collecting or publishing
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          INSIGHT_REVIEW_REPORT_PATH: ${{ runner.temp }}/insight-translation-review.json
        run: INSIGHT_REVIEW_CODE_REF="$(git rev-parse HEAD)" node scripts/evaluate-insight-translations.mjs
      - name: Save safe evaluation metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: insight-translation-review
          path: ${{ runner.temp }}/insight-translation-review.json
          if-no-files-found: error
          retention-days: 14
