name: Merge Workers AI Translation PR

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check and merge
        required: true
        type: string

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  merge:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve pull requests
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            numbers="$INPUT_PR"
          elif [ "$EVENT_NAME" = "push" ]; then
            numbers="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[] | select(.head.ref | startswith("translation/workers-ai/") or startswith("translation/openai/")) | .number')"
          else
            numbers="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
            if [ -z "$numbers" ]; then
              numbers="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${WORKFLOW_SHA}/pulls" --jq '.[0].number // empty' || true)"
            fi
          fi
          {
            echo 'numbers<<EOF'
            echo "$numbers"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check out current main
        if: steps.pr.outputs.numbers != ''
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Create translation Bot token
        id: app-token
        if: steps.pr.outputs.numbers != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.TRANSLATION_BOT_CLIENT_ID }}
          private-key: ${{ secrets.TRANSLATION_BOT_APP_PRIVATE_KEY }}

      - name: Set up Node.js
        if: steps.pr.outputs.numbers != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.numbers != ''
        run: npm ci

      - name: Merge or enable auto-merge for eligible translation PRs
        if: steps.pr.outputs.numbers != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBERS: ${{ steps.pr.outputs.numbers }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for pr_number in $PR_NUMBERS; do
            args=("--pr=${pr_number}")
            if [ -n "$WORKFLOW_SHA" ]; then
              args+=("--expected-sha=${WORKFLOW_SHA}")
            fi
            node --experimental-strip-types scripts/merge-openai-translation-pr.mjs "${args[@]}"
          done
