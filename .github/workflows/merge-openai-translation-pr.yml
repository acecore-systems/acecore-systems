name: Merge OpenAI Translation PR

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check and merge
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=${INPUT_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$number" ]; then
            number="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${WORKFLOW_SHA}/pulls" --jq '.[0].number // empty')"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      - name: Check out current main
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.pr.outputs.number != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: steps.pr.outputs.number != ''
        run: npm ci

      - name: Merge only a current translation PR
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          args=("--pr=${{ steps.pr.outputs.number }}")
          if [ -n "$WORKFLOW_SHA" ]; then
            args+=("--expected-sha=${WORKFLOW_SHA}")
          fi
          node --experimental-strip-types scripts/merge-openai-translation-pr.mjs "${args[@]}"
