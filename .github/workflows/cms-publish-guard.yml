name: CMS Publish Guard

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: cms-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: CMS Publish Guard
    if: >-
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'cms/systems/publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checks and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cms-publish-guard.mjs
