name: Read back seven public Insight translations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    if: github.ref == 'refs/heads/codex/systems-translation-readback-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the isolated readback commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the original publication revision
        run: test "$(git rev-parse HEAD^)" = '73c6eca0ba56096bb91675a2eaee33b2a28e91df'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Read existing results and preserve only valid public drafts
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
        run: node --experimental-strip-types scripts/read-public-insight-translations-20261117.mjs "$RUNNER_TEMP/public-insight-readback"
      - name: Save verified public Markdown drafts
        uses: actions/upload-artifact@v7
        with:
          name: public-insight-readback-20261117
          path: ${{ runner.temp }}/public-insight-readback
          if-no-files-found: error
          retention-days: 2
