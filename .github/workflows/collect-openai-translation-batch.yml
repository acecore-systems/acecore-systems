name: Collect OpenAI Translation Batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e8fdbb519b9a38ce8d6f32a46e040b90622bd4f6
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download only the completed article translations
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {decodeMetadata} from './scripts/openai-translation-batch.mjs';
          const batchId='batch_6ac73291596481908e00d92eeb3451eb';
          const sourceHash='3c4afe625ac527d3a3008692e4acb9b0f798d60c1cfba668b91110931d0b6e3a';
          const locales=new Set(['en','zh-cn','es','pt','fr','ko','de','ru']);
          assert.ok(process.env.OPENAI_TRANSLATION_API_KEY);
          async function get(path) {
            const response=await fetch('https://api.openai.com/v1'+path,{headers:{Authorization:'Bearer '+process.env.OPENAI_TRANSLATION_API_KEY},signal:AbortSignal.timeout(30000)});
            assert.equal(response.status,200,'Batch read failed');
            return response;
          }
          const batch=await (await get('/batches/'+batchId)).json();
          assert.equal(batch.id,batchId);
          assert.equal(batch.metadata.repository,process.env.GITHUB_REPOSITORY);
          assert.equal(batch.metadata.source_hash,sourceHash);
          assert.equal(batch.status,'completed');
          assert.deepEqual(batch.request_counts,{total:8,completed:8,failed:0});
          assert.ok(batch.output_file_id);
          const lines=(await (await get('/files/'+encodeURIComponent(batch.output_file_id)+'/content')).text()).split(/\r?\n/u).filter(Boolean).map(JSON.parse);
          assert.equal(lines.length,8);
          const dir=process.env.RUNNER_TEMP+'/ubuntu26-translations';
          mkdirSync(dir);
          const files=[];
          for (const output of lines) {
            const metadata=decodeMetadata(output.custom_id);
            assert.equal(metadata.kind,'insight');
            assert.equal(metadata.sourcePath,'src/content/insights/ubuntu26-lts-upgrade-recovery.md');
            assert.equal(metadata.sourceHash,sourceHash);
            assert.ok(locales.delete(metadata.locale),'Unexpected or duplicate locale');
            assert.equal(output.response?.status_code,200);
            const text=output.response.body.output.flatMap(item=>(item.content??[]).filter(content=>typeof content.text==='string').map(content=>content.text)).join('');
            const translated=JSON.parse(text);
            assert.equal(typeof translated.markdown,'string');
            writeFileSync(dir+'/'+metadata.locale+'.md',translated.markdown);
            files.push({locale:metadata.locale,sha256:createHash('sha256').update(translated.markdown).digest('hex')});
          }
          assert.equal(locales.size,0);
          const manifest={batchId,sourceHash,counts:batch.request_counts,files};
          writeFileSync(dir+'/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify(manifest));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu26-completed-translations
          path: ${{ runner.temp }}/ubuntu26-translations
          retention-days: 14
