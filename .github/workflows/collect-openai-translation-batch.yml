name: Collect OpenAI Translation Batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 85289f8d16adfcb0f1f4e9c23cd4d167ad653807
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Inspect only the current article Batch
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
          SOURCE_HASH: 3c4afe625ac527d3a3008692e4acb9b0f798d60c1cfba668b91110931d0b6e3a
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          assert.ok(process.env.OPENAI_TRANSLATION_API_KEY);
          const response=await fetch('https://api.openai.com/v1/batches?limit=100',{headers:{Authorization:`Bearer ${process.env.OPENAI_TRANSLATION_API_KEY}`},signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,200,'Could not read Batch status');
          const batches=(await response.json()).data.filter(batch=>batch.metadata?.source_hash===process.env.SOURCE_HASH&&batch.metadata?.repository===process.env.GITHUB_REPOSITORY);
          assert.equal(batches.length,1,'Expected exactly one Batch for this reviewed source');
          const batch=batches[0];
          const result={id:batch.id,status:batch.status,requestCounts:batch.request_counts,createdAt:batch.created_at,sourceHash:batch.metadata.source_hash,sourceCommit:batch.metadata.source_commit,errors:batch.errors??null};
          const json=JSON.stringify(result,null,2)+'\n';
          console.log(json);
          writeFileSync(`${process.env.RUNNER_TEMP}/ubuntu26-batch-status.json`,json);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu26-batch-status
          path: ${{ runner.temp }}/ubuntu26-batch-status.json
          retention-days: 30
