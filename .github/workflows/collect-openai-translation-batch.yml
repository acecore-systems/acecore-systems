name: Collect OpenAI Translation Batch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatched diagnostic commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Read existing completed batch without applying results
        env:
          OPENAI_TRANSLATION_API_KEY: ${{ secrets.OPENAI_TRANSLATION_API_KEY }}
        run: node --experimental-strip-types scripts/diagnose-translation-inline-code.mjs
      - name: Preserve public article diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: translation-inline-code-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/translation-inline-code-diagnostic/
          retention-days: 7
