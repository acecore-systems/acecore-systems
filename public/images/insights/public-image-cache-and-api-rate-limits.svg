<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#163851"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#55dfc7"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="80" y="90" font-size="23" fill="#55dfc7" font-weight="700">ACECORE SYSTEMS</text><text x="80" y="147" font-size="21" fill="#8ca9bf" font-weight="600">PUBLIC IMAGES / DYNAMIC API REQUESTS</text><text x="80" y="220" font-size="51" fill="#f2f7fa" font-weight="700">Separate reuse from request limits</text><text x="80" y="276" font-size="25" fill="#c2d2df" font-weight="400">An edge cache reduces source reads. WAF rules decide which requests count.</text><rect x="80" y="470" width="225" height="184" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="104" y="517" font-size="25" fill="#55dfc7" font-weight="700">BROWSER</text><text x="104" y="561" font-size="21" fill="#c2d2df" font-weight="400">Read the entry</text><text x="104" y="594" font-size="21" fill="#c2d2df" font-weight="400">Load its image</text><path d="M305 561H344" stroke="#55dfc7" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="365" y="470" width="245" height="184" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="389" y="517" font-size="25" fill="#55dfc7" font-weight="700">EDGE / WAF</text><text x="389" y="561" font-size="21" fill="#c2d2df" font-weight="400">Classify requests</text><text x="389" y="594" font-size="21" fill="#c2d2df" font-weight="400">Apply the rule</text><path d="M610 561H646V422H684" stroke="#55dfc7" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M646 561V675H684" stroke="#55dfc7" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="705" y="330" width="355" height="184" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="729" y="377" font-size="25" fill="#55dfc7" font-weight="700">PUBLIC IMAGE</text><text x="729" y="421" font-size="21" fill="#c2d2df" font-weight="400">Validated immutable bytes</text><text x="729" y="454" font-size="21" fill="#c2d2df" font-weight="400">HIT: reuse the image</text><text x="729" y="487" font-size="21" fill="#c2d2df" font-weight="400">ETag: conditional response</text><path d="M1060 422H1100" stroke="#55dfc7" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1120" y="330" width="400" height="184" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="1144" y="377" font-size="25" fill="#55dfc7" font-weight="700">MISS → SOURCE</text><text x="1144" y="421" font-size="21" fill="#c2d2df" font-weight="400">Validate the 200 response</text><text x="1144" y="454" font-size="21" fill="#c2d2df" font-weight="400">Store only eligible images</text><text x="1144" y="487" font-size="21" fill="#c2d2df" font-weight="400">Cache errors: keep delivery</text><rect x="705" y="584" width="355" height="184" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="729" y="631" font-size="25" fill="#f4ba62" font-weight="700">DYNAMIC API</text><text x="729" y="675" font-size="21" fill="#c2d2df" font-weight="400">Independent request budget</text><text x="729" y="708" font-size="21" fill="#c2d2df" font-weight="400">Count the selected API calls</text><text x="729" y="741" font-size="21" fill="#c2d2df" font-weight="400">Keep application limits</text><path d="M1060 676H1100" stroke="#55dfc7" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1120" y="584" width="400" height="184" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="1144" y="631" font-size="25" fill="#f4ba62" font-weight="700">LIVE DATA</text><text x="1144" y="675" font-size="21" fill="#c2d2df" font-weight="400">Fetch current content</text><text x="1144" y="708" font-size="21" fill="#c2d2df" font-weight="400">Check response and UI</text><text x="1144" y="741" font-size="21" fill="#c2d2df" font-weight="400">Observe normal navigation</text><text x="80" y="854" font-size="20" fill="#8ca9bf" font-weight="400">Public immutable images only · Per-data-center cache · Verify response bytes as well as HIT status</text></g></svg>
