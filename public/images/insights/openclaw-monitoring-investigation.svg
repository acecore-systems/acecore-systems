<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#163851"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif" fill="#f2f7fa"><text x="80" y="90" font-size="23" font-weight="700" letter-spacing="3" fill="#55dfc7">ACECORE SYSTEMS</text><text x="80" y="153" font-size="21" letter-spacing="2" fill="#a8bece">OPENCLAW / MONITORING</text><text x="80" y="225" font-size="61" font-weight="700">From signals to evidence</text><text x="80" y="281" font-size="27" fill="#c2d2df">Detection • Bounded investigation • Clear reporting</text><g><rect x="80" y="342" width="442" height="288" rx="22" fill="#142b41" stroke="#28516b" stroke-width="2"/><circle cx="129" cy="391" r="23" fill="#55dfc7"/><text x="129" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#102338">01</text><text x="109" y="455" font-size="30" font-weight="700" fill="#55dfc7">DETECT</text><text x="109" y="505" font-size="26" font-weight="600">Scheduled checks</text><text x="109" y="557" font-size="20" fill="#c2d2df">Normal / abnormal / unavailable</text></g><g><rect x="546" y="342" width="442" height="288" rx="22" fill="#142b41" stroke="#28516b" stroke-width="2"/><circle cx="595" cy="391" r="23" fill="#55dfc7"/><text x="595" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#102338">02</text><text x="575" y="455" font-size="30" font-weight="700" fill="#55dfc7">INVESTIGATE</text><text x="575" y="505" font-size="26" font-weight="600">Read-only scope</text><text x="575" y="557" font-size="20" fill="#c2d2df">Target, time and output limits</text></g><g><rect x="1012" y="342" width="442" height="288" rx="22" fill="#142b41" stroke="#28516b" stroke-width="2"/><circle cx="1061" cy="391" r="23" fill="#55dfc7"/><text x="1061" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#102338">03</text><text x="1041" y="455" font-size="30" font-weight="700" fill="#55dfc7">REPORT</text><text x="1041" y="505" font-size="26" font-weight="600">Facts + unknowns</text><text x="1041" y="557" font-size="20" fill="#c2d2df">Keep partial evidence on timeout</text></g><rect x="80" y="676" width="1400" height="70" rx="15" fill="#203e53"/><text x="112" y="721" font-size="26" font-weight="600">Repair: a separate decision and authorization</text><text x="80" y="804" font-size="24" fill="#c2d2df">A healthy check does not prove every service is healthy.</text><text x="1480" y="859" text-anchor="end" font-size="18" fill="#8ca9bf">Generalized operations design • Not a topology diagram</text></g></svg>