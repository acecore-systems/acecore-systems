<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#163851"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif" fill="#f2f7fa"><text x="80" y="90" font-size="23" font-weight="700" letter-spacing="3" fill="#55dfc7">ACECORE SYSTEMS</text><text x="80" y="151" font-size="21" letter-spacing="2" fill="#a8bece">SESSION LIFECYCLE / GENERALIZED DESIGN</text><text x="80" y="224" font-size="59" font-weight="700">Make login expiry a clear contract</text><text x="80" y="281" font-size="27" fill="#c2d2df">Explicit sign-in • Server enforcement • Verified reauthentication</text><rect x="80" y="337" width="341" height="292" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><circle cx="127" cy="384" r="22" fill="#55dfc7"/><text x="127" y="391" text-anchor="middle" font-size="19" font-weight="700" fill="#102338">01</text><text x="105" y="450" font-size="26" font-weight="700" fill="#55dfc7">SIGN IN</text><text x="105" y="504" font-size="24" font-weight="600">Verify success</text><text x="105" y="562" font-size="17" fill="#c2d2df">Set the applicable period</text><rect x="445" y="337" width="341" height="292" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><circle cx="492" cy="384" r="22" fill="#55dfc7"/><text x="492" y="391" text-anchor="middle" font-size="19" font-weight="700" fill="#102338">02</text><text x="470" y="450" font-size="26" font-weight="700" fill="#55dfc7">VALID</text><text x="470" y="504" font-size="24" font-weight="600">Check on server</text><text x="470" y="562" font-size="17" fill="#c2d2df">Normal traffic adds no time</text><rect x="810" y="337" width="341" height="292" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><circle cx="857" cy="384" r="22" fill="#f4ba62"/><text x="857" y="391" text-anchor="middle" font-size="19" font-weight="700" fill="#102338">03</text><text x="835" y="450" font-size="26" font-weight="700" fill="#f4ba62">EXPIRES</text><text x="835" y="504" font-size="24" font-weight="600">Enforce the limit</text><text x="835" y="562" font-size="17" fill="#c2d2df">Handle pages and APIs</text><rect x="1175" y="337" width="341" height="292" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><circle cx="1222" cy="384" r="22" fill="#55dfc7"/><text x="1222" y="391" text-anchor="middle" font-size="19" font-weight="700" fill="#102338">04</text><text x="1200" y="450" font-size="26" font-weight="700" fill="#55dfc7">SIGN IN AGAIN</text><text x="1200" y="504" font-size="24" font-weight="600">Validate the result</text><text x="1200" y="562" font-size="17" fill="#c2d2df">Check fresh-auth requirements</text><rect x="80" y="675" width="1436" height="76" rx="15" fill="#203e53"/><text x="111" y="723" font-size="26" font-weight="600">Review three scopes: identity provider / application session / browser cookie</text><text x="80" y="807" font-size="24" fill="#c2d2df">Each service enforces its own session boundary.</text><text x="1516" y="859" text-anchor="end" font-size="18" fill="#8ca9bf">Concept diagram • No internal targets or timeout values</text></g></svg>