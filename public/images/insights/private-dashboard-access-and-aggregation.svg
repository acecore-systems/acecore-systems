<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#163851"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="80" y="90" font-size="23" font-weight="700" fill="#55dfc7">ACECORE SYSTEMS</text><text x="80" y="147" font-size="21" font-weight="600" fill="#8ca9bf">PRIVATE DASHBOARD / ACCESS AND AGGREGATION</text><text x="80" y="220" font-size="51" font-weight="700" fill="#f2f7fa">Protect the data behind the screen</text><text x="80" y="276" font-size="25" font-weight="400" fill="#c2d2df">The page gate and the API boundary serve different checks</text><rect x="80" y="340" width="420" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="105" y="390" font-size="24" font-weight="700" fill="#55dfc7">01</text><text x="105" y="446" font-size="28" font-weight="700" fill="#55dfc7">ACCESS GATE</text><text x="105" y="498" font-size="22" font-weight="400" fill="#c2d2df">Authenticate the viewer</text><text x="105" y="534" font-size="22" font-weight="400" fill="#c2d2df">Keep the screen private</text><path d="M518 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="572" y="340" width="420" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="597" y="390" font-size="24" font-weight="700" fill="#55dfc7">02</text><text x="597" y="446" font-size="28" font-weight="700" fill="#55dfc7">API BOUNDARY</text><text x="597" y="498" font-size="22" font-weight="400" fill="#c2d2df">Validate permitted requests</text><text x="597" y="534" font-size="22" font-weight="400" fill="#c2d2df">Do not trust a page URL</text><path d="M1010 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1064" y="340" width="450" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="1089" y="390" font-size="24" font-weight="700" fill="#55dfc7">03</text><text x="1089" y="446" font-size="28" font-weight="700" fill="#55dfc7">AGGREGATE</text><text x="1089" y="498" font-size="22" font-weight="400" fill="#c2d2df">Filter by defined intervals</text><text x="1089" y="534" font-size="22" font-weight="400" fill="#c2d2df">Verify D1 query indexes</text><rect x="80" y="632" width="1434" height="132" rx="20" fill="#203e53" stroke="#31536a" stroke-width="2"/><text x="112" y="685" font-size="28" font-weight="700" fill="#55dfc7">SOURCE RECORDS</text><path d="M493 674h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="685" font-size="28" font-weight="700" fill="#55dfc7">COUNTS / FILTERS / DISPLAY</text><text x="112" y="735" font-size="25" font-weight="400" fill="#c2d2df">Zero rows, missing data, and failed reads are different results</text><text x="80" y="853" font-size="20" font-weight="400" fill="#8ca9bf">Generalized internal case · No account names, message bodies, or internal URLs</text></g></svg>
