<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#163851"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="80" y="90" font-size="23" font-weight="700" fill="#55dfc7">ACECORE SYSTEMS</text><text x="80" y="147" font-size="21" font-weight="600" fill="#8ca9bf">NEXTCLOUD TALK / OPERATIONS NOTIFICATIONS</text><text x="80" y="220" font-size="51" font-weight="700" fill="#f2f7fa">Receipt is a step, not resolution</text><text x="80" y="276" font-size="25" font-weight="400" fill="#c2d2df">Keep a minimal notification and a protected management link</text><rect x="80" y="342" width="330" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="105" y="392" font-size="24" font-weight="700" fill="#55dfc7">01</text><text x="105" y="448" font-size="28" font-weight="700" fill="#55dfc7">DETECT</text><text x="105" y="500" font-size="22" font-weight="400" fill="#c2d2df">Record the issue</text><text x="105" y="536" font-size="22" font-weight="400" fill="#c2d2df">Preserve business state</text><path d="M422 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="342" width="330" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="485" y="392" font-size="24" font-weight="700" fill="#55dfc7">02</text><text x="485" y="448" font-size="28" font-weight="700" fill="#55dfc7">SEND</text><text x="485" y="500" font-size="22" font-weight="400" fill="#c2d2df">Scoped bot connection</text><text x="485" y="536" font-size="22" font-weight="400" fill="#c2d2df">Keep secrets on the server</text><path d="M802 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="840" y="342" width="330" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="865" y="392" font-size="24" font-weight="700" fill="#55dfc7">03</text><text x="865" y="448" font-size="28" font-weight="700" fill="#55dfc7">RECEIVE</text><text x="865" y="500" font-size="22" font-weight="400" fill="#c2d2df">Check the real destination</text><text x="865" y="536" font-size="22" font-weight="400" fill="#c2d2df">Match the send record</text><path d="M1182 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1220" y="342" width="294" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="1245" y="392" font-size="24" font-weight="700" fill="#f4ba62">04</text><text x="1245" y="448" font-size="28" font-weight="700" fill="#f4ba62">RESOLVE</text><text x="1245" y="500" font-size="22" font-weight="400" fill="#c2d2df">Authorized operator</text><text x="1245" y="536" font-size="22" font-weight="400" fill="#c2d2df">Business acceptance</text><rect x="80" y="636" width="1434" height="128" rx="20" fill="#203e53" stroke="#31536a" stroke-width="2"/><text x="112" y="689" font-size="28" font-weight="700" fill="#55dfc7">VERIFIED</text><text x="336" y="689" font-size="27" font-weight="400" fill="#f2f7fa">Harmless production connection test received</text><text x="112" y="733" font-size="24" font-weight="700" fill="#f4ba62">PENDING</text><text x="336" y="733" font-size="24" font-weight="400" fill="#c2d2df">Real incident completion / mobile push confirmation</text><text x="80" y="853" font-size="20" font-weight="400" fill="#8ca9bf">Notification readers and management operators have separate permissions</text></g></svg>
