<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#163851"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif" fill="#f2f7fa"><text x="80" y="90" font-size="23" font-weight="700" letter-spacing="3" fill="#55dfc7">ACECORE SYSTEMS</text><text x="80" y="153" font-size="21" letter-spacing="2" fill="#a8bece">RESTIC / CLOUDFLARE R2</text><text x="80" y="225" font-size="61" font-weight="700">Can the data be restored?</text><text x="80" y="281" font-size="27" fill="#c2d2df">Storage • Integrity • Restoration • Application recovery</text><g><rect x="80" y="342" width="329" height="288" rx="22" fill="#142b41" stroke="#28516b" stroke-width="2"/><circle cx="129" cy="391" r="23" fill="#55dfc7"/><text x="129" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#102338">01</text><text x="109" y="455" font-size="27" font-weight="700" fill="#55dfc7">STORE</text><text x="109" y="505" font-size="23" font-weight="600">Fresh snapshot</text><text x="109" y="557" font-size="18" fill="#c2d2df">Track latest successful backup</text></g><g><rect x="433" y="342" width="329" height="288" rx="22" fill="#142b41" stroke="#28516b" stroke-width="2"/><circle cx="482" cy="391" r="23" fill="#55dfc7"/><text x="482" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#102338">02</text><text x="462" y="455" font-size="27" font-weight="700" fill="#55dfc7">CHECK</text><text x="462" y="505" font-size="23" font-weight="600">Integrity scope</text><text x="462" y="557" font-size="18" fill="#c2d2df">Record full or partial checking</text></g><g><rect x="786" y="342" width="329" height="288" rx="22" fill="#142b41" stroke="#28516b" stroke-width="2"/><circle cx="835" cy="391" r="23" fill="#55dfc7"/><text x="835" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#102338">03</text><text x="815" y="455" font-size="27" font-weight="700" fill="#55dfc7">RESTORE</text><text x="815" y="505" font-size="23" font-weight="600">Isolated test</text><text x="815" y="557" font-size="18" fill="#c2d2df">Compare contents and hashes</text></g><g><rect x="1139" y="342" width="329" height="288" rx="22" fill="#142b41" stroke="#986b36" stroke-width="2"/><circle cx="1188" cy="391" r="23" fill="#f4ba62"/><text x="1188" y="398" font-size="19" font-weight="700" text-anchor="middle" fill="#102338">04</text><text x="1168" y="455" font-size="27" font-weight="700" fill="#f4ba62">START APP</text><text x="1168" y="505" font-size="23" font-weight="600">Separate validation</text><text x="1168" y="557" font-size="18" fill="#c2d2df">Full recovery still needs proof</text></g><rect x="80" y="676" width="1400" height="70" rx="15" fill="#203e53"/><text x="112" y="721" font-size="26" font-weight="600">Retention: inspect → forget → prune → check</text><text x="80" y="804" font-size="24" fill="#c2d2df">A completed job does not prove complete recovery.</text><text x="1480" y="859" text-anchor="end" font-size="18" fill="#8ca9bf">Generalized operations design • Not a topology diagram</text></g></svg>