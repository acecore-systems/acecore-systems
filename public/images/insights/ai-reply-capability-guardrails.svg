<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1828"/><stop offset="1" stop-color="#163851"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="80" y="90" font-size="23" font-weight="700" fill="#55dfc7">ACECORE SYSTEMS</text><text x="80" y="147" font-size="21" font-weight="600" fill="#8ca9bf">AI REPLIES / CONTEXT AND CAPABILITY</text><text x="80" y="220" font-size="51" font-weight="700" fill="#f2f7fa">Check what a reply promises</text><text x="80" y="276" font-size="25" font-weight="400" fill="#c2d2df">A fluent response still needs evidence, capability, and permission</text><rect x="80" y="342" width="330" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="105" y="392" font-size="24" font-weight="700" fill="#55dfc7">01</text><text x="105" y="448" font-size="28" font-weight="700" fill="#55dfc7">CONTEXT</text><text x="105" y="500" font-size="22" font-weight="400" fill="#c2d2df">Question / invitation</text><text x="105" y="536" font-size="22" font-weight="400" fill="#c2d2df">Ended conversation</text><path d="M422 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="342" width="330" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="485" y="392" font-size="24" font-weight="700" fill="#55dfc7">02</text><text x="485" y="448" font-size="28" font-weight="700" fill="#55dfc7">GROUNDING</text><text x="485" y="500" font-size="22" font-weight="400" fill="#c2d2df">Valid reference results</text><text x="485" y="536" font-size="22" font-weight="400" fill="#c2d2df">Failure is not evidence</text><path d="M802 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="840" y="342" width="330" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="865" y="392" font-size="24" font-weight="700" fill="#55dfc7">03</text><text x="865" y="448" font-size="28" font-weight="700" fill="#55dfc7">CAPABILITY</text><text x="865" y="500" font-size="22" font-weight="400" fill="#c2d2df">Who will act?</text><text x="865" y="536" font-size="22" font-weight="400" fill="#c2d2df">Can that action happen?</text><path d="M1182 462h36m-11-10 11 10-11 10" fill="none" stroke="#55dfc7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1220" y="342" width="294" height="245" rx="20" fill="#142b41" stroke="#31536a" stroke-width="2"/><text x="1245" y="392" font-size="24" font-weight="700" fill="#55dfc7">04</text><text x="1245" y="448" font-size="28" font-weight="700" fill="#55dfc7">RECHECK</text><text x="1245" y="500" font-size="22" font-weight="400" fill="#c2d2df">Current policy</text><text x="1245" y="536" font-size="22" font-weight="400" fill="#c2d2df">Latest conversation</text><rect x="80" y="636" width="1434" height="129" rx="20" fill="#203e53" stroke="#31536a" stroke-width="2"/><text x="112" y="687" font-size="30" font-weight="700" fill="#f4ba62">HOLD / SKIP</text><text x="409" y="687" font-size="30" font-weight="700" fill="#55dfc7">REVIEW</text><text x="789" y="687" font-size="30" font-weight="700" fill="#55dfc7">AUTHORIZED SEND</text><text x="112" y="735" font-size="25" font-weight="400" fill="#c2d2df">Separate outcomes · A past AI promise is not proof of a real plan</text><text x="80" y="853" font-size="20" font-weight="400" fill="#8ca9bf">Concept diagram · Limited validation is not a guarantee for every phrase or model</text></g></svg>
