# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.172.4/schema/sveltia-cms.json

backend:
  name: github
  repo: acecore-systems/acecore-systems
  branch: main

locale: ja
media_folder: public/uploads
public_folder: /uploads
publish_mode: editorial_workflow

collections:
  - name: settings
    label: サイト設定
    files:
      - name: site
        label: 共通設定
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: サイト名, widget: string }
          - { name: description, label: サイト説明, widget: text }
          - { name: siteUrl, label: サイトURL, widget: string }
          - { name: acecoreUrl, label: Acecore URL, widget: string }
          - { name: contactFormAction, label: フォーム送信先, widget: string }
          - {
              name: turnstileSiteKey,
              label: Turnstileサイトキー,
              widget: string,
            }
          - { name: ga4Id, label: GA4測定ID, widget: string }
          - { name: lineUrl, label: LINE URL, widget: string }
          - { name: email, label: メール, widget: string }
          - { name: phone, label: 電話番号, widget: string }
          - label: ナビゲーション
            name: nav
            widget: list
            fields:
              - { name: label, label: 表示名, widget: string }
              - { name: href, label: リンク, widget: string }
          - label: フッターリンク
            name: footerLinks
            widget: list
            fields:
              - { name: label, label: 表示名, widget: string }
              - { name: href, label: リンク, widget: string }
  - name: pages
    label: 固定ページ
    files:
      - name: home
        label: ホーム
        file: src/data/home.json
        format: json
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: heroEyebrow, label: ヒーロー英字見出し, widget: string }
          - { name: heroTitle, label: ヒーロータイトル, widget: string }
          - { name: heroLead, label: ヒーローリード, widget: text }
          - { name: primaryCta, label: 主要CTA, widget: string }
          - { name: primaryCtaHref, label: 主要CTAリンク, widget: string }
          - { name: secondaryCta, label: 補助CTA, widget: string }
          - { name: secondaryCtaHref, label: 補助CTAリンク, widget: string }
          - { name: layersTitle, label: 3層セクション見出し, widget: string }
          - { name: layersLead, label: 3層セクション説明, widget: text }
          - label: 現場・仕組み・運用
            name: layers
            widget: list
            min: 3
            max: 3
            fields:
              - { name: label, label: 層の名称, widget: string }
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
          - {
              name: philosophyEyebrow,
              label: 設計思想英字見出し,
              widget: string,
            }
          - { name: philosophyTitle, label: 設計思想見出し, widget: string }
          - { name: philosophyLead, label: 設計思想説明, widget: text }
          - label: 設計原則
            name: designPrinciples
            widget: list
            fields:
              - { name: number, label: 番号, widget: string }
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
          - {
              name: consultationEyebrow,
              label: 相談場面英字見出し,
              widget: string,
            }
          - {
              name: consultationTitle,
              label: 相談場面セクション見出し,
              widget: string,
            }
          - { name: consultationLead, label: 相談場面説明, widget: text }
          - label: 相談される場面
            name: consultationSituations
            widget: list
            fields:
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
              - { name: href, label: リンク, widget: string }
          - { name: ctaEyebrow, label: CTA英字見出し, widget: string }
          - { name: ctaTitle, label: CTA見出し, widget: string }
          - { name: ctaBody, label: CTA本文, widget: text }
          - { name: ctaLabel, label: CTAボタン, widget: string }
          - { name: ctaHref, label: CTAリンク, widget: string }
      - name: services
        label: サービス
        file: src/data/services.json
        format: json
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: heroTitle, label: ヒーロータイトル, widget: string }
          - { name: heroLead, label: ヒーローリード, widget: text }
          - label: サービス項目
            name: services
            widget: list
            fields:
              - { name: id, label: ID, widget: string }
              - {
                  name: detailUrl,
                  label: 詳細ページURL,
                  widget: string,
                  required: false,
                }
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
              - {
                  name: examples,
                  label: 対応例,
                  widget: list,
                  field: { name: item, label: 項目, widget: string },
                }
          - label: 進め方
            name: process
            widget: list
            fields:
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
      - name: pricing
        label: 料金
        file: src/data/pricing.json
        format: json
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: heroTitle, label: ヒーロータイトル, widget: string }
          - { name: heroLead, label: ヒーローリード, widget: text }
          - label: 料金項目
            name: items
            widget: list
            fields:
              - {
                  name: key,
                  label: 料金キー,
                  widget: string,
                  hint: サービス詳細から参照されるため、公開後は変更しないでください。,
                }
              - { name: label, label: ラベル, widget: string }
              - { name: price, label: 料金, widget: string }
              - { name: note, label: 補足, widget: text }
              - {
                  name: detailUrl,
                  label: 支援内容の詳細URL,
                  widget: string,
                  required: false,
                }
      - name: guide
        label: 導入ガイド
        file: src/data/guide.json
        format: json
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: heroTitle, label: ヒーロータイトル, widget: string }
          - { name: heroLead, label: ヒーローリード, widget: text }
          - { name: introTitle, label: 導入見出し, widget: string }
          - { name: introBody, label: 導入本文, widget: text }
          - label: 視点
            name: insights
            widget: list
            fields:
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
          - { name: tipsTitle, label: ポイント見出し, widget: string }
          - { name: tipsLead, label: ポイント説明, widget: text }
          - label: 確認ポイント
            name: tips
            widget: list
            fields:
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
              - label: 箇条書き
                name: points
                widget: list
                field: { name: item, label: 項目, widget: string }
          - { name: faqTitle, label: FAQ見出し, widget: string }
          - label: FAQ
            name: faqs
            widget: list
            fields:
              - { name: question, label: 質問, widget: string }
              - { name: answer, label: 回答, widget: text }
          - { name: ctaTitle, label: CTA見出し, widget: string }
          - { name: ctaBody, label: CTA本文, widget: text }
          - { name: ctaLabel, label: CTAボタン, widget: string }
      - name: works
        label: 実績
        file: src/data/works.json
        format: json
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: heroTitle, label: ヒーロータイトル, widget: string }
          - { name: heroLead, label: ヒーローリード, widget: text }
          - label: 実績
            name: cases
            widget: list
            fields:
              - {
                  name: id,
                  label: アンカーID,
                  widget: string,
                  hint: case- から始まる変更しない識別子です。外部リンクから参照されます。,
                }
              - { name: title, label: タイトル, widget: string }
              - { name: category, label: カテゴリ, widget: string }
              - { name: summary, label: 概要, widget: text }
              - { name: challenge, label: 課題, widget: text }
              - { name: proposal, label: 提案, widget: text }
              - { name: result, label: 成果, widget: text }
              - { name: image, label: 画像, widget: image, required: false }
              - {
                  name: imageAlt,
                  label: 画像の代替テキスト,
                  widget: string,
                  required: false,
                  hint: 画像の内容を具体的に説明してください。未入力時は実績タイトルが使用されます。,
                }
              - {
                  name: externalUrl,
                  label: 外部URL,
                  widget: string,
                  required: false,
                }
              - {
                  name: detailUrl,
                  label: 詳細ページURL,
                  widget: string,
                  required: false,
                }
      - name: contact
        label: お問い合わせ
        file: src/data/contact.json
        format: json
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: heroTitle, label: ヒーロータイトル, widget: string }
          - { name: heroLead, label: ヒーローリード, widget: text }
          - { name: formLead, label: フォーム説明, widget: text }
          - label: よくある質問
            name: faqs
            widget: list
            fields:
              - { name: question, label: 質問, widget: string }
              - { name: answer, label: 回答, widget: text }
      - name: privacy
        label: プライバシー
        file: src/data/privacy.json
        format: json
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - label: セクション
            name: sections
            widget: list
            fields:
              - { name: title, label: 見出し, widget: string }
              - { name: body, label: 本文, widget: text }
  - name: service_details
    label: サービス詳細
    label_singular: サービス詳細
    folder: src/data/service-details
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { name: title, label: ページ名, widget: string }
      - { name: description, label: SEO説明, widget: text }
      - { name: heroEyebrow, label: ヒーロー英字見出し, widget: string }
      - { name: heroTitle, label: ヒーロータイトル, widget: string }
      - { name: heroLead, label: ヒーローリード, widget: text }
      - { name: indexSummary, label: 一覧用説明, widget: text }
      - label: 一覧用トピック
        name: indexTopics
        widget: list
        field: { name: item, label: 項目, widget: string }
      - { name: introTitle, label: 導入見出し, widget: string }
      - { name: introBody, label: 導入本文, widget: text }
      - label: よくある課題
        name: challenges
        widget: list
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: body, label: 本文, widget: text }
      - { name: offeringsTitle, label: 提供範囲見出し, widget: string }
      - { name: offeringsLead, label: 提供範囲説明, widget: text }
      - label: 提供項目
        name: offerings
        widget: list
        fields:
          - {
              name: id,
              label: アンカーID,
              widget: string,
              hint: 料金ページから参照されるため、公開後は変更しないでください。,
            }
          - { name: title, label: 見出し, widget: string }
          - { name: body, label: 本文, widget: text }
          - label: 含まれる内容
            name: includes
            widget: list
            field: { name: item, label: 項目, widget: string }
          - label: 料金キー
            name: pricingKeys
            widget: list
            hint: 料金ページの料金キーを指定します。
            field: { name: key, label: キー, widget: string }
          - {
              name: priceNote,
              label: 料金補足,
              widget: string,
              required: false,
            }
      - { name: processTitle, label: 進め方見出し, widget: string }
      - { name: processLead, label: 進め方説明, widget: text }
      - label: 進め方
        name: process
        widget: list
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: body, label: 本文, widget: text }
      - { name: resourcesTitle, label: 技術資料見出し, widget: string }
      - { name: resourcesLead, label: 技術資料説明, widget: text }
      - label: 技術資料
        name: resources
        widget: list
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: href, label: URL, widget: string }
      - { name: ctaTitle, label: CTA見出し, widget: string }
      - { name: ctaBody, label: CTA本文, widget: text }
  - name: work_details
    label: 実績詳細
    label_singular: 実績詳細
    folder: src/data/work-details
    create: false
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { name: title, label: ページ名, widget: string }
      - { name: description, label: SEO説明, widget: text }
      - { name: category, label: カテゴリ, widget: string }
      - { name: heroEyebrow, label: ヒーロー英字見出し, widget: string }
      - { name: heroTitle, label: ヒーロータイトル, widget: string }
      - { name: heroLead, label: ヒーローリード, widget: text }
      - { name: overviewTitle, label: 概要見出し, widget: string }
      - { name: overviewBody, label: 概要本文, widget: text }
      - label: 基本情報
        name: facts
        widget: list
        fields:
          - { name: label, label: 項目名, widget: string }
          - { name: value, label: 内容, widget: string }
      - { name: outcomesTitle, label: 実現した状態見出し, widget: string }
      - label: 実現した状態
        name: outcomes
        widget: list
        fields:
          - { name: label, label: 区分, widget: string }
          - { name: body, label: 内容, widget: text }
      - label: 課題・方針
        name: story
        widget: list
        fields:
          - { name: label, label: 区分, widget: string }
          - { name: title, label: 見出し, widget: string }
          - { name: body, label: 本文, widget: text }
      - { name: scopeTitle, label: 対応範囲見出し, widget: string }
      - { name: scopeLead, label: 対応範囲説明, widget: text }
      - label: 対応範囲
        name: scope
        widget: list
        fields:
          - { name: title, label: 見出し, widget: string }
          - { name: body, label: 本文, widget: text }
          - label: 対応項目
            name: items
            widget: list
            field: { name: item, label: 項目, widget: string }
      - { name: resourcesTitle, label: 技術資料見出し, widget: string }
      - { name: resourcesLead, label: 技術資料説明, widget: text }
      - label: 技術資料
        name: resources
        widget: list
        fields:
          - { name: title, label: タイトル, widget: string }
          - { name: description, label: 説明, widget: text }
          - { name: href, label: URL, widget: string }
      - { name: externalUrl, label: 関連サイトURL, widget: string }
      - { name: ctaTitle, label: CTA見出し, widget: string }
      - { name: ctaBody, label: CTA本文, widget: text }
